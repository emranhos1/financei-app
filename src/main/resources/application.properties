# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db_v2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Admin User Credentials (for first-run initialization)
admin.username=admin
admin.password=admin123

# Application Settings
app.name=Daily Finance Management System
app.version=1.0.0
